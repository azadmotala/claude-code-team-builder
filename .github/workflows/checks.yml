name: Checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  links:
    name: Links and anchors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 .github/scripts/check_links.py

  example-drift:
    name: Example matches templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 .github/scripts/check_example_drift.py
